
<div class="w-full h-full perp pb-2">
    <div
        class="transform duration-1000 style relative w-full h-full"
        [ngClass]="{'flip-horizontal': isDisplayingReviewLayout}"
    >
        <div
            class="
                front item min-w-[260px] bg-neutral-100 absolute hide-backface
                rounded-md shadow-lg border-gray-900 h-full w-full
            " #frontDisplay
        >
            <h3
                class="
                    bg-orange-500/40 rounded-t-sm bg-blend-lighten p-1
                    text-neutral-800 font-light font-serif shadow-md
                "
            >
                {{ item.name }}
            </h3>
            <h4 class="m-1 p-1 sm:m-[2px] text-neutral-800 font-extralight">
                {{ item.description }}
            </h4>
            <div class="review flex flex-col">  
                <div *ngIf="item.reviewOptions">
                    <h4 *ngIf="item.reviewOptions.details.length > 0; else noReviews" >
                        <a href="#" (click) = "showReviews($event)" class="font-semibold underline">
                            {{ avgStarRating }}
                        </a>
                        / {{ MAX_STAR_COUNT }}
                    </h4>
                    <ng-template #noReviews>
                        N/A / {{ MAX_STAR_COUNT }}
                    </ng-template>
                    <div class="flex flex-row w-max align-middle self-center m-auto ">
                        <div *ngFor="let star of [1,2,3,4,5]; let i=index">
                            <span
                                title="⭐"
                                class="
                                    m-auto min-w-[15px] min-h-[15px] text-transparent before:absolute
                                    before:content-[attr(title)] before:text-transparent star-border
                                "
                                [ngClass]="
                                    {'before:active-star-fill': i < numStarsSelected,
                                    'before:inactive-star-fill': i >= numStarsSelected || isNaN(numStarsSelected)}
                                "
                            >   
                                ⭐
                            </span>
                        </div>  
                    </div>
                </div>
                <button
                    (click)="openReviewBox()"
                    class="
                        font-serif font-light underline w-fit m-auto rounded-lg lg:p-[6px]
                        hover:scale-[1.02] p-[2px] lg:text-base text-sm justify-end
                    "
                >
                    Write a review...
                </button>
            </div>
        </div>
        <div class="
            back flex-col item min-w-[280px] h-full absolute hide-backface w-full
            bg-neutral-100 rounded-md shadow-lg border-gray-900 flip-horizontal
        ">
            <div class="flex flex-col relative z-1000 ">
                <div class="flex flex-row bg-slate-200">

                    <!-- https://pixlok.com/icons/back-arrow-svg-icon-free-download/ -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="13.496"
                        height="11.21"
                        viewBox="0 0 13.496 11.21"
                        class="justify-start my-auto cursor-pointer border-none ml-[2px] bg-transparent"
                        (click)="openReviewBox()"
                    >
                        <g id="Arrow_Icon" data-name="Arrow Icon" transform="translate(0 -41.674)">
                        <g id="Group_7" data-name="Group 7" transform="translate(0 41.674)">
                            <path
                                id="Path_21"
                                data-name="Path 21"
                                d="M12.737,46.22l.021,0H3.727L6.566,43.38a.746.746,0,0,0,0-1.048l-.442-.442a.739.739,0,0,0-1.043,0L.215,46.755a.744.744,0,0,0,0,1.047l4.867,4.867a.74.74,0,0,0,1.043,0l.442-.442a.731.731,0,0,0,.215-.521.709.709,0,0,0-.215-.512L3.7,48.332h9.052a.765.765,0,0,0,.749-.757V46.95A.75.75,0,0,0,12.737,46.22Z"
                                transform="translate(0 -40.674)"
                            />
                        </g>
                        </g>
                    </svg>
                    <app-stars
                        (click)="updateStars($event)"
                        class="block p-1 top-full w-full left-0 border-b-[1px] z-10 border-b-gray-400 justify-center"
                    >
                    </app-stars>
                </div>
            
                <textarea
                    rows="6"
                    cols="25"
                    (input)="setReviewContent($event)"
                    placeholder="Start review here..."
                    #reviewBox
                    class="
                        text-black border-none p-1 outline-none block self-center justify-center text-left indent-[2px]
                        z-auto md:indent-1 min-w-[70px] min-h-[25px] w-full h-full lg:min-w-[150px] lg:min-h-[60px] flex-grow rounded-md
                    "
                >
                </textarea>

                <div class="border-t-[1px] border-gray-400 w-full h-full">
                    <div
                        class="
                            bg-blue-400 flex flex-row w-fit self-center text-center justify-center m-auto pr-1
                            pl-1 rounded-2xl shadow:sm hover:shadow-lg shadow-blue-400 hover:scale-[1.02]
                        "
                    > <!-- Add a delete option later? -->
                        <button
                            id="submit"
                            type="text"
                            (click)="submitReview()"
                            class=" text-white lg:px-2 px-[3px] lg:py-[2px] py-[1px]"
                        >
                            Submit
                        </button>
                    </div>
                </div>      
            <div>
        </div>
    </div>
</div>
