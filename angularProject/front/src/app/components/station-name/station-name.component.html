<div class="relative px-2 mt-2 mb-0 border border-neutral-600/10 shadow-sm ">
    <h3
        class="block font-medium lg:text-2xl sm:text-lg md:text-xl align-middle text-base self-center mt-auto"
        appTextShadow
    >
        {{ stationName }} <button (click)="toggleStationDisplay()" type="button">{{ convertBooleanToSectionToken(isStationExpanded) }}</button>
    </h3>
    <br>
    <div
        *ngIf="isStationExpanded"
        class="
            itemCat grid grid-flow-row xl:grid-cols-fluid lg:grid-cols-fluid-1 sm:grid-cols-fluid-2 grid-cols-fluid-3
            xl:grid-rows-1 lg:grid-rows-2 md:grid-rows-2 sm:grid-rows-2 grid-rows-4 w-full
        "
    >
        <div *ngFor="let item of shopItems.get(stationName) | keyvalue; let i = index" class="flex flex-wrap mx-auto">
            <app-item
                *ngIf="isItemsExpanded || i <= defaultItemLimit"
                [diningHall] = 'diningHall'
                [indicator]="i"
                [stationName]="stationName"
                class="min-h-[220px] w-[260px] max-h-[320px]"
            >
            </app-item>
        </div>

    </div>
    <button class="min-h-[20px] min-w-[20px]" (click)="toggleAdditionalItemsDisplay()" type="button">
        {{ convertBooleanToSectionToken(isItemsExpanded) }}
    </button>
</div>
