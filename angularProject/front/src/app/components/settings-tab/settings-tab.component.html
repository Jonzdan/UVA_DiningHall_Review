<div class="flex flex-grow flex-row flex-wrap overflow-x-hidden border-b-2 py-3 w-full min-w-[300px]">
    <div class="flex flex-grow flex-col w-full " *ngIf="!isPasswordResetTabActive; else singleValue" [ngClass]="{'lg:flex-row': isNotificationTabActive, '' : !isNotificationTabActive}">
        <div id="subtext" class="font-sans text-sm text-start w-[40%]">
            <h2 class="font-semibold"> {{titleTextMapping[currentTab].title}} </h2>
            <h3 class="font-medium tracking-tight text-neutral-500/80 overflow-hidden min-w-[220px] h-fit"> {{titleTextMapping[currentTab].description}}</h3>
        </div>
        <div class="flex flex-col flex-grow font-sans text-sm text-start mt-4 w-full px-1" *ngIf="isNotificationTabActive">
            <div *ngFor="let setting of settings | keyvalue" class="my-auto flex flex-grow h-full justify-center align-middle items-center px-1"> <!-- this is good if we have a nested object, but what about just plain values -->
                <div class="my-4 flex flex-grow overflow-scroll h-full justify-center align-middle items-center"> 
                    <app-toggle [isToggled]="checkIfPropIsChecked(setting.key)" [name]="getToggleTitle(setting.key)" [subtext]="getToggleDescription(setting.key)" (isToggledChange)="onToggleChange(setting.key, $event)" class="flex flex-col flex-grow h-full justify-center p-1"></app-toggle>
                </div>
            </div>
            <div class="flex flex-row w-full text-neutral-100">
                <button *ngIf="pendingChanges" type="submit" class="flex ml-auto mr-2 px-3 py-1 bg-green-700 opacity-90 my-2 rounded-sm hover:opacity-100 transition-opacity duration-200" (click)="saveChange()">Save Changes</button>
                <button *ngIf="pendingChanges" type="submit" class="flex mr-auto ml-2 px-3 py-1 bg-red-700 opacity-90 my-2 rounded-sm hover:opacity-100 transition-opacity duration-200" (click)="discardChange()">Discard Changes</button>
            </div>
        </div>
        <div class="flex flex-col flex-grow font-sans text-sm text-start mt-4 w-full" *ngIf="isProfileTabActive">
            <app-settings-tab-profile [title]="profileTabMetadata.title" [description]="profileTabMetadata.description"></app-settings-tab-profile>
        </div>
    </div>
   <!-- Potentially add push notifications later -->
   <ng-template #singleValue class="flex flex-row w-full h-fit">
        <app-reset-password [title]="passwordTabMetadata.title" [description]="passwordTabMetadata.description"></app-reset-password>
   </ng-template>
</div>
<dialog #modal class="bg-neutral-50 text-center min-w-[200px] w-[30%] min-h-[250px] p-0 rounded-md">
    <div class="flex flex-col fixed min-w-[200px] w-[30%] min-h-[250px] p-0 m-auto rounded-md">
        <div class="flex flex-row w-full bg-[#232D48] text-start indent-1 text-neutral-200 font-sans font-semibold h-full">
            Alert
        </div>
        <div class="flex flex-grow flex-col w-full h-full tracking-tight"> 
            <h2 class="w-full text-xl py-1 border-b-2 font-bold"> {{dialogText}} </h2> 
            <h4 class="font-light"> {{subDialogText}} </h4>
        </div>
        <button (click)="closeModal()" class="align-bottom mt-auto text-center h-full mb-1 border-t-2 hover:text-lg" > Close </button>
    </div>
    
</dialog>
<button (click)="showModals()"> TEMP MODAL TESTING BUTTON </button>
