<div id="navbar" class="flex align-middle justify-center w-full shadow-md py-1" *ngIf="!isNavBarHidden">
    <div class="hover:cursor-pointer" routerLink="../">
        <h1 class=" text xl:first-letter:text-5xl xl:text-4xl lg:first-letter:text-4xl lg:text-3xl first-letter:text-2xl text-lg md:first-letter:text-3xl md:text-2xl text-start self-center tracking-tight first-letter:text-amber-400 indent-3 " appTextShadow> HOO<span class="italic"></span><span class="xl:text-5xl lg:text-4xl md:text-3xl sm:text-2xl text-xl">F</span>OOD </h1> 
    </div>
    <ul class="font-semibold xl:text-sm lg:text-sm sm:text-xs md:text-xs text-xs flex justify-end items-center w-full flex-1 flex-grow lg:gap-4 gap-2" *ngIf="!isNavBarIcon">
        <app-nav-link class="flex flex-row">
            <!-- any collapsible options -->

        </app-nav-link>
        <div class="flex mr-2">
            <h2 *ngIf="!signedIn">{{ accountText }}</h2>
        </div>
    </ul>
    <div *ngIf="isNavBarIcon" class="flex justify-end flex-grow z-10 flex-row items-center h-full ">
        <svg class="ml-auto mr-3 hover:cursor-pointer self-center " fill="#eaeadc" height="20px" width="20px" (click)="openSideBar()"  version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 150 150" xml:space="preserve" stroke="#000000" stroke-width="0.0015"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g id="XMLID_240_"> <path id="XMLID_241_" d="M15,30h120c8.284,0,15-6.716,15-15s-6.716-15-15-15H15C6.716,0,0,6.716,0,15S6.716,30,15,30z"></path> <path id="XMLID_242_" d="M135,60H15C6.716,60,0,66.716,0,75s6.716,15,15,15h120c8.284,0,15-6.716,15-15S143.284,60,135,60z"></path> <path id="XMLID_243_" d="M135,120H15c-8.284,0-15,6.716-15,15s6.716,15,15,15h120c8.284,0,15-6.716,15-15S143.284,120,135,120z"></path> </g> </g></svg>
    </div>
    <div *ngIf="isSignedIn$ | async">
        <app-dropdown #dropdownContainer [open]="isDropDownToggled" (openChange)="toggleDropDown($event)" [align]="'right'">
                <!-- Trigger -->
            <div *ngIf="signedIn" class="flex items-center" dropdown-trigger>
                <svg class="scale-[.4] lg:scale-[.5] lg:hover:scale-[.55] hover:scale-[.45] m-0 hover:cursor-pointer rounded-full shadow-lg shadow-black/20 " [ngClass]="{'hidden': !signedIn, 'flex':signedIn}" 
                    version="1.1"
                    xmlns="http://www.w3.org/2000/svg" 
                    xmlns:xlink="http://www.w3.org/1999/xlink" 
                    width="50" 
                    height="50"
                    fill="white">
                    
                    <defs>
                        <clipPath id="circular-border">
                        <circle cx="25" cy="25" r="23.33" />
                        </clipPath>
                        <clipPath id="avoid-antialiasing-bugs">
                        <rect width="100%" height="41.5" />
                        </clipPath>
                    </defs>
                    
                    <circle cx="25" cy="25" r="23.33" fill="black" clip-path="url(#avoid-antialiasing-bugs)" />
                    <circle cx="25" cy="19.17" r="9.58" />
                    <circle cx="25" cy="45.83" r="17.1" clip-path="url(#circular-border)" />
                
                </svg>
                <h4 class="lg:text-sm text-xs font-light">Welcome {{ accountText }}</h4>
            </div>

<app-side-car
    [show]="showMenu" 
    [title]="'Menu'" 
    (close)="closeSideBar()"
    class=""
>
    <app-nav-link class="flex flex-col"></app-nav-link>
    <div class="flex mr-2">
        <h2 *ngIf="!signedIn">{{ accountText }}</h2>
    </div>
    <li class="lg:mr-2 mr-1 lg:ml-2 ml-1 relative overflow-hidden flex flex-row items-center duration-100 text-inherit w-full" >
        <!-- Written by Treer (gitlab.com/Treer) -->
        <div *ngIf="signedIn" class="flex flex-col flex-grow relative m-1 mt-5 w-full"> <!-- fix height later (when screen size is small)-->
            <div class="flex-col relative w-full h-full" id="dropdown_container">
                <h3 class="lg:text-sm text-xs font-light hover:scale-[1.02] text-center" appTextShadow> Welcome {{ accountText }} </h3>
                <ul class="items-center w-full z-30  text-inherit rounded-md m-1 flex flex-col overflow-auto"> <!-- fix where svg appears on smaller screens... -->
                    <li class="flex flex-shrink flex-row border-b-[1px] border-b-neutral-600 w-full p-2 "> <!-- user info -->
                        <img src="" alt="N/A" class="ml-auto">
                        <div class="flex flex-col mr-auto text-start indent-1 text-neutral-300">
                            <h3 class="flex-wrap overflow-auto text-xs font-normal leading-tight" > {{accountText}} </h3> <!-- name -->
                            <h3 class="flex-wrap text-xs font-normal leading-tight"> @{{accountText}} </h3> <!-- some type of @ -->
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </li>
</app-side-car>
